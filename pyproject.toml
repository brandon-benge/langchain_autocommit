[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-autocommit"
version = "2.0.0"
description = "Agentic Git automation — generates conventional commits using LLMs with automatic API fallback"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "LangChain AutoCommit Contributors" },
]
keywords = ["git", "commit", "automation", "langchain", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "langchain-core>=0.3.17,<0.3.85",
    "langchain-community>=0.3.7,<0.4.0",
    "langchain>=0.3.7,<0.4.0",
    "langchain-text-splitters>=0.3.0,<0.4.0",
    "langchain-ollama>=0.3.10,<0.4.0",
    "langchain-openai>=0.3.0,<0.4.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "keyring>=24.0.0",
    "typing-extensions>=4.9.0",
    "langgraph>=0.3.0,<1.0.0",
    "httpx==0.27.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
]
github = [
    "PyGithub>=2.0,<3.0",
]
gitlab = [
    "python-gitlab>=4.0,<5.0",
]
auto-pr = [
    "autocommit[github]",
]

[project.scripts]
autocommit = "autocommit.cli:main"

[tool.setuptools.packages.find]
include = ["autocommit*"]

[tool.setuptools.package-data]
autocommit = ["params.yaml"]
