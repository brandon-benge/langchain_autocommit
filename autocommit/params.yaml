project_name: "LangChain AutoCommit"
python_version: "3.10"
llm:
  primary:
    base_url: "https://opencode.ai/zen/go/v1"
    model: "deepseek-v4-flash"
    temperature: 0.2
    max_tokens: 512
    timeout: 60
    # keychain:
    #   service: "langchain_autocommit"
    #   key: "opencode_api_key"
    env_var: "OPENCODE_API_KEY"    # Alternative: read API key from env var instead of keychain

  fallback:
    base_url: "http://localhost:11434"
    model: "qwen3:8b"
    temperature: 0.2
    max_tokens: 4096

git:
  autostage_all: true
  signoff: true
  push_after_commit: true
  allow_amend: false
  conventional: true
  default_type: "chore"
  scope_from_folder: true
  max_subject_length: 100
  max_diff_chars: 8000
  max_changed_files: 20
  include_diff_patch: true
  ticket_regex: '[A-Z]{2,}-\d+'

paths:
  logs_dir: "logs"
  temp_dir: "tmp"
